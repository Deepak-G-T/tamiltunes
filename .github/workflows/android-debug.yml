name: Android debug APK

# Builds an installable debug APK on every push and keeps it as a downloadable "artifact" (Actions tab > the run > Artifacts).
# A debug APK is signed with a throw-away debug key: fine for testing on your own phone, not for sharing or updating an installed release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners already have the Android SDK (ANDROID_HOME). Use its newest sdkmanager directly: the setup-android action
      # asks for the old "tools" package, which current command-line tools no longer have, and fails.
      - name: Install Android platform and build tools
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - run: npm ci
      - name: Verify plugin patch was applied
        run: |
          grep -q "tamiltunes:audio_playback" node_modules/capacitor-music-controls-plugin/android/src/main/java/com/ingageco/capacitormusiccontrols/MusicControlsNotificationKiller.java || {
            echo "::error::capacitor-music-controls-plugin patch was not applied by postinstall!"
            exit 1
          }
      - run: npm test
      - name: Build the web app and copy it into the Android project
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}   # public Web client id (GitHub variable), see docs/GOOGLE_SIGNIN.md
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}   # optional: error reports from the app (docs/MONITORING.md); empty = off
        run: npm run build:android

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with the release key when the four secrets exist (see docs/APP_UPDATES.md and docs/GOOGLE_SIGNIN.md). Without them the throw-away debug key is used.
      - name: Decode the release key (only if the secret exists; never printed)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tamiltunes-release.jks"
            echo "TAMILTUNES_KEYSTORE_PATH=$RUNNER_TEMP/tamiltunes-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build the debug APK
        working-directory: frontend/android
        env:
          TAMILTUNES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TAMILTUNES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TAMILTUNES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug -PtamiltunesVersionCode=${{ github.run_number }} -PtamiltunesVersionName=1.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: tamiltunes-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
