name: Android debug APK

# Builds an installable debug APK on every push and keeps it as a downloadable "artifact" (Actions tab > the run > Artifacts).
# A debug APK is signed with a throw-away debug key: fine for testing on your own phone, not for sharing or updating an installed release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci
      - run: npm test
      - name: Build the web app and copy it into the Android project
        run: npm run build:android

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug -PtamiltunesVersionCode=${{ github.run_number }} -PtamiltunesVersionName=1.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: tamiltunes-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
