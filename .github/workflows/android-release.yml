name: Android release APK

# Push a tag like v1.0.1 and CI builds a SIGNED release APK, then publishes a GitHub Release with app-release.apk and version.json.
# The app's "Check for updates" button reads that release. One-time setup (keystore + four secrets): docs/APP_UPDATES.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the Release (the built-in GITHUB_TOKEN; no personal token anywhere)

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the changelog is the commit list since the previous tag

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Work out the version from the tag (must be vX.Y.Z)
        run: node scripts/make-version-json.mjs --tag "$GITHUB_REF_NAME" --print-env >> "$GITHUB_ENV"

      - name: Check the signing secrets exist (never printed)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for n in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!n}" ]; then echo "::error::The GitHub secret $n is missing. See docs/APP_UPDATES.md (one-time keystore setup)."; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tamiltunes-release.jks"
          echo "TAMILTUNES_KEYSTORE_PATH=$RUNNER_TEMP/tamiltunes-release.jks" >> "$GITHUB_ENV"

      - name: Install Android platform and build tools
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - run: npm ci
      - run: npm test
      - name: Build the web app and copy it into the Android project
        run: npm run build:android

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the signed release APK
        working-directory: frontend/android
        env:
          TAMILTUNES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TAMILTUNES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TAMILTUNES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PtamiltunesVersionCode=$VERSION_CODE -PtamiltunesVersionName=$VERSION_NAME

      - name: Verify the APK is signed (an unsigned file is named app-release-unsigned.apk and fails here)
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/36.0.0/apksigner)
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"

      - name: Write version.json and the release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}HEAD
          git log --no-merges --pretty='- %s' $RANGE | head -12 > "$RUNNER_TEMP/changelog.txt" || true
          [ -s "$RUNNER_TEMP/changelog.txt" ] || echo "- Improvements and fixes" > "$RUNNER_TEMP/changelog.txt"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release.apk"
          node scripts/make-version-json.mjs --tag "$GITHUB_REF_NAME" --apk "$RUNNER_TEMP/app-release.apk" --changelog "$RUNNER_TEMP/changelog.txt" --out "$RUNNER_TEMP/version.json"
          { echo "TamilTunes $VERSION_NAME"; echo; cat "$RUNNER_TEMP/changelog.txt"; echo; echo "SHA-256: $(sha256sum "$RUNNER_TEMP/app-release.apk" | cut -d' ' -f1)"; } > "$RUNNER_TEMP/notes.md"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/app-release.apk" "$RUNNER_TEMP/version.json" --title "TamilTunes $VERSION_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/tamiltunes-release.jks"
