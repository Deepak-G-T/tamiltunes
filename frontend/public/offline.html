<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090B" />
    <title>TamilTunes - offline</title>
    <style>
      html, body { margin: 0; height: 100%; background: #09090b; color: #fff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
      .logo { width: 72px; height: 72px; border-radius: 24px; background: linear-gradient(to top right, #17a34a, #1ed760); display: flex; align-items: center; justify-content: center; }
      h1 { margin: 6px 0 0; font-size: 22px; }
      p { margin: 0; max-width: 28ch; color: #a1a1aa; font-size: 15px; line-height: 1.5; }
      button { margin-top: 10px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #1ed760; color: #000; font-weight: 700; font-size: 16px; cursor: pointer; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 6-5.2-3.9a.5.5 0 0 0-.8.4V18" /><circle cx="9" cy="18" r="4" /></svg>
      </div>
      <h1>You are offline</h1>
      <p>TamilTunes needs the internet to play songs. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>window.addEventListener('online', function () { location.reload(); });</script>
  </body>
</html>
