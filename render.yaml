services:
  - type: web
    name: tamiltunes-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # REQUIRED: exact Vercel origin(s), comma-separated. "*" is NOT a wildcard (it matches nothing)
      - key: VERCEL_TEAM_SLUG
        sync: false # REQUIRED in production: startup fails if unset. Pins the Vercel preview-origin regex to your team
      - key: FRONTEND_URL
        sync: false # Optional alias for CORS_ORIGIN: your Vercel origin
      - key: MUSIC_PROVIDER
        value: jiosaavn
      - key: ENABLE_EXTERNAL_STREAMS
        value: "false"
      - key: DATABASE_URL
        # Neon DIRECT (non-pooler) connection string, set once in the Render dashboard:
        #   postgresql://USER:PASS@ep-xxxx.ap-southeast-1.aws.neon.tech/DB?sslmode=require&connect_timeout=15&connection_limit=5
        # (drop channel_binding=... if Neon adds it). Not synced from the Blueprint so a sync can never
        # point the service back at the old Render database.
        sync: false

# Legacy Render Postgres (free plan: deleted 30 days after creation, 2026-12-17). Keep until Neon has run
# stably for a week, then remove this block and delete the database in the Render dashboard.
databases:
  - name: tamiltunes-db
    databaseName: tamiltunes
    user: tamiltunes_user
    plan: free
    region: singapore
