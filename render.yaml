services:
  - type: web
    name: tamiltunes-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: tamiltunes-db
          property: connectionString

databases:
  - name: tamiltunes-db
    databaseName: tamiltunes
    user: tamiltunes_user
    plan: free
    region: singapore
